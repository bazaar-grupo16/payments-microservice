# ──────────────────────────────────────────────────────────────
# Kubernetes Service — Payments Microservice
# ──────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: payments-service
  labels:
    app: payments-service
spec:
  type: ClusterIP
  selector:
    app: payments-service
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
