# ──────────────────────────────────────────────────────────────
# Kubernetes Deployment — Bazaar Payments Microservice
# ──────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-service
  labels:
    app: payments-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payments-service
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
      labels:
        app: payments-service
    spec:
      imagePullSecrets:
        - name: ghcr-login-secret
      containers:
        - name: payments-service
          image: $IMAGE_NAME:$IMAGE_TAG
          ports:
            - containerPort: 8000
          # ── Environment from Kubernetes Secret ──────
          env:
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: payments-service-credentials
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: payments-service-credentials
                  key: DB_PORT
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: payments-service-credentials
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: payments-service-credentials
                  key: DB_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: payments-service-credentials
                  key: DB_NAME
            - name: MP_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: payments-service-credentials
                  key: MP_ACCESS_TOKEN
            - name: MP_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: payments-service-credentials
                  key: MP_WEBHOOK_SECRET
            - name: ORDERS_SERVICE_URL
              valueFrom:
                secretKeyRef:
                  name: payments-service-credentials
                  key: ORDERS_SERVICE_URL
            - name: WEBHOOK_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: payments-service-credentials
                  key: WEBHOOK_BASE_URL
            - name: BAZAAR_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: payments-service-credentials
                  key: BAZAAR_BASE_URL
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector:4317"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "grpc"
            - name: OTEL_SERVICE_NAME
              value: payments-service
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "deployment.environment=dev,k8s.cluster.name=bazaar-dev"
            - name: OTEL_PROPAGATORS
              value: "tracecontext,baggage"
          livenessProbe:
            httpGet:
              path: /livez
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          # ── Resources ──────────────────────────────
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 256Mi

