# ──────────────────────────────────────────────────────────────
# Kubernetes Deployment — Payments PostgreSQL Database
# ──────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-db
  labels:
    app: payments-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payments-db
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5432"
      labels:
        app: payments-db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          # ── Environment from Kubernetes Secret ──────
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: payments-service-credentials
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: payments-service-credentials
                  key: DB_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: payments-service-credentials
                  key: DB_NAME
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector:4317"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "grpc"
            - name: OTEL_SERVICE_NAME
              value: payments-db
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "deployment.environment=dev,k8s.cluster.name=bazaar-dev"
            - name: OTEL_PROPAGATORS
              value: "tracecontext,baggage"
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - exec pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - exec pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 10
          # ── Resources ──────────────────────────────
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # ── Persistent Storage ──────────────────────
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: payments-db-pvc
