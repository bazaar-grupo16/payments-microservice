# ──────────────────────────────────────────────────────────────
# Kubernetes Secret — Bazaar Payments Microservice
# ──────────────────────────────────────────────────────────────
# Real values are injected by GitHub Actions via envsubst.
# NEVER commit actual credentials to this file.
apiVersion: v1
kind: Secret
metadata:
  name: payments-service-credentials
type: Opaque
stringData:
  # ── Database ──────────────────────────────────────
  DB_HOST: payments-db
  DB_PORT: "5432"
  DB_USER: $DB_USER
  DB_PASSWORD: $DB_PASSWORD
  DB_NAME: payments-db
  # ── MercadoPago ───────────────────────────────────
  MP_ACCESS_TOKEN: $MP_ACCESS_TOKEN
  MP_WEBHOOK_SECRET: $MP_WEBHOOK_SECRET
  # ── Internal Services ─────────────────────────────
  ORDERS_SERVICE_URL: $ORDERS_SERVICE_URL
