# ──────────────────────────────────────────────────────────────
# Kubernetes Service — Payments PostgreSQL Database
# ──────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: payments-db
  labels:
    app: payments-db
spec:
  type: ClusterIP
  selector:
    app: payments-db
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
